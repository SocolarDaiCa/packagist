services:
    app:
        build: .
        container_name: php-apache
        volumes:
            - .:/var/www/html
        depends_on:
            - database
            - redis
        restart: unless-stopped
        networks:
            - traefik-network
            - app-network
        labels:
            - "traefik.enable=true"
            - "traefik.docker.network=traefik-network"
            # HTTP router — redirects all traffic to HTTPS
            - "traefik.http.routers.supper-pos.rule=Host(`${APP_HOST}`)"
            - "traefik.http.routers.supper-pos.entrypoints=web"
            - "traefik.http.routers.supper-pos.middlewares=https-redirect"
            # HTTPS router
            - "traefik.http.routers.supper-pos-secure.rule=Host(`${APP_HOST}`)"
            - "traefik.http.routers.supper-pos-secure.entrypoints=websecure"
            - "traefik.http.routers.supper-pos-secure.tls.certresolver=myresolver"
            - "traefik.http.routers.supper-pos-secure.middlewares=cors"
            - "traefik.http.services.supper-pos.loadbalancer.server.port=80"
            # Middleware: permanent HTTP→HTTPS redirect
            - "traefik.http.middlewares.https-redirect.redirectscheme.scheme=https"
            - "traefik.http.middlewares.https-redirect.redirectscheme.permanent=true"

#    database:
#        image: mysql:8.0
#        ports:
#            - 3307:3306
#        environment:
#            MYSQL_ALLOW_EMPTY_PASSWORD: 1
#            MYSQL_DATABASE: packagist

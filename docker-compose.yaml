#        volumes:
#            - data:/var/lib/mysql
#        networks:
#            - app-network
    database:
        image: 'mysql:8.0'
        restart: unless-stopped
        tty: true
        ports:
            - '3307:3306'
        volumes:
            - data:/var/lib/mysql
        environment:
            MYSQL_ALLOW_EMPTY_PASSWORD: true
            MYSQL_DATABASE: 'packagist'
            # MYSQL_PASSWORD: ''
            MYSQL_ROOT_PASSWORD: '${MYSQL_ROOT_PASSWORD}'
        networks:
            - app-network
        labels:
            - "traefik.enable=true"
            - "traefik.http.routers.mysql.rule=Host(`mysql.docker.localhost`)"
            - "traefik.http.routers.mysql.entrypoints=3306"
            - "traefik.http.services.mysql.loadbalancer.server.port=3306"

    redis:
        image: redis:6.2-alpine
        ports:
            - "6379"
        networks:
            - app-network

volumes:
    data:
networks:
    app-network:
        driver: bridge
    traefik-network:
        external: true
